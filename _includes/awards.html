<ul>
{% assign selected = include.tags | split: "," %}
{% for item in site.data.awards %}
{% if item.tag %}{% unless selected contains item.tag %}{% continue %}{% endunless %}{% endif %}
<li class="cv-item">{{ item.award }}
<span class="right">
<small>{% if item.location %}{{ item.location }}; {% endif %}
{{ item.year }}</small></span>
</li>
{% endfor %}
</ul>
