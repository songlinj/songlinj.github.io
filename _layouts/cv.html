---
layout: default
---

<style>
body {
  font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
}
.site-footer, .site-nav {
  display: none;
}
.cv-item .right {
  float: right;
}
.intro-box div, .cv-item span {
  display: inline-block;
  vertical-align: top;
}
.cv-item .small {
  font-size: small;
  line-height: 1.2;
}
ul {
  margin-left: 20px;
  list-style-type: circle;
}
table {
  border: none;
  color: black;
}
table td, table th {
  border: none;
  padding: 1px;
}
table tr:nth-child(even) {
  background-color: rgba(0, 0, 0, 0);
}
table td:first-child {
  font-weight: bold;
}
h2 {
  border-bottom: 1px solid black;
}
/* Optional content: hidden by default, revealed via ?show= (see script below). */
.opt {
  display: none;
}
</style>

{{ content }}

<script>
(function () {
  var show = (new URLSearchParams(window.location.search).get('show') || '')
    .split(',').map(function (s) { return s.trim(); }).filter(Boolean);
  if (!show.length) return;
  var all = show.indexOf('all') !== -1;

  document.querySelectorAll('.opt').forEach(function (el) {
    var reveal = all || show.some(function (g) { return el.classList.contains('opt-' + g); });
    if (reveal) el.classList.remove('opt');
  });
})();
</script>
